<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>워드앤코드 퍼블리싱 프로젝트</title>
    <meta name="description" content="웹 프로젝트 페이지의 PC/모바일 진행도, 카테고리, 미리보기를 한 화면에서 관리하는 워드앤코드 퍼블리싱 대시보드." />

    <!-- 브라우저 chrome 색상: 라이트/다크 모드 분기 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph (Slack/카카오/페이스북 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="워드앤코드 퍼블리싱 프로젝트" />
    <meta property="og:description" content="페이지별 진행도와 미리보기를 한눈에 보는 퍼블리싱 대시보드." />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="http://m16.co.kr/familynet/projects/" />
    <meta property="og:image" content="http://m16.co.kr/familynet/projects/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="워드앤코드 퍼블리싱 프로젝트 대시보드" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="워드앤코드 퍼블리싱 프로젝트" />
    <meta name="twitter:description" content="페이지별 진행도와 미리보기를 한눈에 보는 퍼블리싱 대시보드." />
    <meta name="twitter:image" content="http://m16.co.kr/familynet/projects/og-image.png" />

    <!-- 외부 인덱싱 방지 (내부 도구) -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
      // 다크모드/콘트라스트/폰트크기 pre-paint — React 부팅 전에 적용해 깜빡임 방지
      (function () {
        try {
          var ls = window.localStorage;
          var dark = ls.getItem('darkMode') === 'true';
          var contrast = ls.getItem('contrast') === 'hot' ? 'hot' : 'default';
          document.documentElement.setAttribute('data-color-scheme', dark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-contrast', contrast);
          var fs = Number(ls.getItem('fontSize'));
          if (fs >= 12 && fs <= 20 && fs !== 16) {
            var scale = fs / 16;
            if (typeof CSS !== 'undefined' && CSS.supports && CSS.supports('zoom', '1')) {
              document.documentElement.style.zoom = String(scale);
            }
          }
        } catch (e) { /* localStorage 차단 환경 — 디폴트로 진행 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
